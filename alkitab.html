<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Alkitab AYT — GRIA Pemulihan Palu</title>
<meta name="description" content="Alkitab Yang Terbuka (AYT) untuk Jemaat GRIA Palu — pilih kitab, pasal, dan ayat lalu scroll membaca pasal demi pasal.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at 50% -8%,rgba(204,255,0,.07),transparent 28%),var(--bg-base);font-family:Manrope,Inter,sans-serif}
.b-wrap{max-width:900px;margin:0 auto;padding:88px var(--pad) 120px;position:relative;z-index:2}
.b-back{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:9px 13px;margin-bottom:22px;border-radius:999px;color:#d9d9dc;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font:700 11.5px Manrope,sans-serif;transition:transform .18s ease,background .18s ease}
.b-back:active{transform:scale(.97);background:rgba(255,255,255,.07)}
.b-head{margin-bottom:22px}.b-kicker{display:flex;align-items:center;gap:7px;color:var(--neon);font:800 10.5px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.1em}.b-kicker:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 12px rgba(204,255,0,.4)}
.b-head h1{font:800 clamp(36px,9vw,56px)/1 Syne,sans-serif;letter-spacing:-.05em;margin:10px 0 9px}.b-head p{max-width:650px;color:#919299;font:500 13px/1.65 Manrope,sans-serif}
.b-controls{position:sticky;top:66px;z-index:35;padding:11px;margin:0 0 18px;border-radius:20px;background:rgba(13,13,16,.9);border:1px solid rgba(255,255,255,.075);box-shadow:0 14px 36px rgba(0,0,0,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.b-selects{display:grid;grid-template-columns:1.35fr .72fr .72fr;gap:7px}.b-selects select{width:100%;min-width:0;min-height:43px;padding:9px 10px;border-radius:13px;color:#eee;background:#08080a;border:1px solid rgba(255,255,255,.09);outline:none;font:700 11px Manrope,sans-serif}
.b-progress{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;padding:0 2px;color:#77787e;font:700 9.5px Manrope,sans-serif}.b-progress strong{color:var(--neon);font-weight:800}
.b-loading{padding:34px 20px;border-radius:20px;background:#111114;border:1px solid rgba(255,255,255,.06);text-align:center;color:#929399;font:600 12px/1.6 Manrope,sans-serif}.pulse{display:inline-flex;gap:5px;margin-bottom:9px}.pulse i{width:6px;height:6px;border-radius:50%;background:var(--neon);animation:pulse 1s ease-in-out infinite}.pulse i:nth-child(2){animation-delay:.14s}.pulse i:nth-child(3){animation-delay:.28s}@keyframes pulse{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.book-reader{display:grid;gap:18px}
.chapter{scroll-margin-top:190px;padding:20px 17px 15px;border-radius:23px;background:linear-gradient(155deg,#121215,#0d0d0f);border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px rgba(0,0,0,.1)}
.chapter-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.055)}
.chapter-head h2{font:800 22px/1.1 Syne,sans-serif;letter-spacing:-.035em}.chapter-head span{color:#67686e;font:800 9px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.chapter-title{margin:0 0 13px;padding:10px 12px;border-radius:12px;color:#d8f781;background:rgba(204,255,0,.045);border:1px solid rgba(204,255,0,.09);font:700 11px/1.5 Manrope,sans-serif}
.verse-list{display:grid;gap:2px}.verse{position:relative;display:grid;grid-template-columns:31px 1fr;gap:10px;padding:10px 9px;border-radius:13px;scroll-margin-top:190px;transition:background .22s ease,border-color .22s ease,transform .22s ease;border:1px solid transparent}.verse:hover{background:rgba(255,255,255,.025)}.verse.selected{background:rgba(204,255,0,.075);border-color:rgba(204,255,0,.18);transform:translateX(2px)}
.vnum{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:9px;color:#a7cb16;background:rgba(204,255,0,.055);font:800 9.5px Manrope,sans-serif}.vtext{color:#e6e6e8;font:500 14.5px/1.75 Manrope,sans-serif}.verse.selected .vnum{color:#050505;background:var(--neon)}
.b-source{margin-top:20px;padding:14px 15px;border-radius:15px;color:#73747a;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);font:500 10.5px/1.6 Manrope,sans-serif}.b-source a{color:#a9d000;text-decoration:underline}
.access-lock{max-width:500px;margin:45px auto 0;padding:27px 22px;border-radius:26px;background:#111114;border:1px solid rgba(255,255,255,.07)}.access-lock h1{font:800 30px/1.05 Syne,sans-serif}.access-lock p{margin-top:10px;color:#8e8f95;font:500 13px/1.6 Manrope,sans-serif}.access-lock a{display:flex;margin-top:18px;min-height:48px;align-items:center;justify-content:center;border-radius:14px;background:var(--neon);color:#050505;font:800 12px Manrope,sans-serif}
@media(max-width:600px){.b-wrap{padding-top:82px}.b-selects{grid-template-columns:1.25fr .75fr}.b-selects #verseSel{grid-column:1/-1}.b-controls{top:64px}.chapter{padding:18px 13px 13px}.chapter-head h2{font-size:20px}.vtext{font-size:14px;line-height:1.72}.verse{padding:9px 6px}.b-head p{font-size:12.5px}}
</style>
</head>
<body>
<nav class="navbar"><div class="navbar-inner"><a href="index.html" class="logo">GRI<span>A</span></a></div></nav>
<main class="b-wrap" id="root"></main>
<script>
(function(){
  'use strict';
  const ACCESS_KEY='gria_member_access_v1';
  const root=document.getElementById('root');
  let bible=null,currentBook=null,chapterObserver=null;

  function member(){try{return localStorage.getItem(ACCESS_KEY)==='yes'}catch(_){return false}}
  function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}

  if(!member()){
    root.innerHTML='<section class="access-lock"><h1>Fitur Jemaat</h1><p>Alkitab tersedia khusus untuk Jemaat GRIA. Masukkan kode jemaat terlebih dahulu.</p><a href="jemaat.html">Masukkan Kode Jemaat</a></section>';
    return;
  }

  root.innerHTML=`
    <a class="b-back" href="jemaat.html" aria-label="Kembali ke halaman Jemaat">← Kembali ke Jemaat</a>
    <header class="b-head">
      <div class="b-kicker">Alkitab Yang Terbuka</div>
      <h1>Alkitab AYT</h1>
      <p>Pilih kitab, pasal, atau ayat. Semua pasal dalam kitab yang dipilih terbuka berurutan sehingga Anda bisa terus scroll membaca tanpa pindah halaman.</p>
    </header>
    <section class="b-controls" aria-label="Navigasi Alkitab">
      <div class="b-selects">
        <select id="bookSel" aria-label="Pilih kitab"></select>
        <select id="chapterSel" aria-label="Pilih pasal"></select>
        <select id="verseSel" aria-label="Pilih ayat"><option value="">Semua ayat</option></select>
      </div>
      <div class="b-progress"><span id="locationLabel">Memuat...</span><strong>Scroll ↓ pasal berikutnya</strong></div>
    </section>
    <div id="reader" class="book-reader"><div class="b-loading"><span class="pulse"><i></i><i></i><i></i></span><br>Memuat Alkitab dari data lokal GRIA...</div></div>
    <div class="b-source">Teks: <strong>Alkitab Yang Terbuka (AYT)</strong> © YLSA-AYT 2011–2024. Penggunaan non-komersial dan atribusi mengikuti lisensi AYT. <a href="AYT-LICENSE.html" target="_blank" rel="noopener">Lihat lisensi</a>.</div>`;

  const bookSel=document.getElementById('bookSel');
  const chapterSel=document.getElementById('chapterSel');
  const verseSel=document.getElementById('verseSel');
  const reader=document.getElementById('reader');
  const locationLabel=document.getElementById('locationLabel');

  fetch('ayt-data.min.json',{cache:'force-cache'})
    .then(r=>{if(!r.ok)throw new Error('Data Alkitab tidak ditemukan');return r.json()})
    .then(data=>{bible=data;initBible()})
    .catch(err=>{reader.innerHTML='<div class="b-loading">Data Alkitab belum dapat dimuat. Pastikan file <strong>ayt-data.min.json</strong> sudah ada di repository dan refresh halaman.</div>';console.error(err)});

  function initBible(){
    bible.books.forEach(book=>{const o=document.createElement('option');o.value=book[0];o.textContent=book[2];bookSel.appendChild(o)});
    let saved={};try{saved=JSON.parse(localStorage.getItem('gria_ayt_location')||'{}')}catch(_){}
    const validBook=bible.books.some(b=>String(b[0])===String(saved.book));
    bookSel.value=validBook?String(saved.book):'43';
    renderBook(parseInt(saved.chapter||3,10),parseInt(saved.verse||16,10));
  }

  function getBook(){return bible.books.find(b=>String(b[0])===String(bookSel.value))}

  function fillSelectors(book,targetChapter,targetVerse){
    chapterSel.innerHTML='';
    book[3].forEach(ch=>{const o=document.createElement('option');o.value=ch[0];o.textContent='Pasal '+ch[0];chapterSel.appendChild(o)});
    const chapterExists=book[3].some(ch=>ch[0]===targetChapter);
    chapterSel.value=String(chapterExists?targetChapter:book[3][0][0]);
    fillVerseSelector(parseInt(chapterSel.value,10),targetVerse);
  }

  function fillVerseSelector(chapterNo,targetVerse){
    const book=getBook();
    const ch=book[3].find(x=>x[0]===chapterNo);
    verseSel.innerHTML='<option value="">Semua ayat</option>';
    if(ch)ch[1].forEach(v=>{const o=document.createElement('option');o.value=v[0];o.textContent='Ayat '+v[0];verseSel.appendChild(o)});
    if(targetVerse&&ch&&ch[1].some(v=>v[0]===targetVerse))verseSel.value=String(targetVerse);
  }

  function renderBook(targetChapter,targetVerse){
    currentBook=getBook();
    if(!currentBook)return;
    fillSelectors(currentBook,targetChapter,targetVerse);
    reader.innerHTML='';
    const frag=document.createDocumentFragment();

    currentBook[3].forEach(ch=>{
      const sec=document.createElement('section');sec.className='chapter';sec.id=`chapter-${ch[0]}`;sec.dataset.chapter=ch[0];
      const firstTitle=ch[1].find(v=>v[2])?.[2]||'';
      sec.innerHTML=`<div class="chapter-head"><h2>${esc(currentBook[2])} ${ch[0]}</h2><span>${ch[1].length} ayat</span></div>${firstTitle?`<div class="chapter-title">${esc(firstTitle)}</div>`:''}<div class="verse-list"></div>`;
      const list=sec.querySelector('.verse-list');
      ch[1].forEach(v=>{
        const article=document.createElement('article');article.className='verse';article.id=`verse-${ch[0]}-${v[0]}`;article.dataset.chapter=ch[0];article.dataset.verse=v[0];
        article.innerHTML=`<div class="vnum">${v[0]}</div><div class="vtext">${esc(v[1])}</div>`;
        article.addEventListener('click',()=>selectVerse(ch[0],v[0],false));
        list.appendChild(article);
      });
      frag.appendChild(sec);
    });
    reader.appendChild(frag);
    setupChapterObserver();
    requestAnimationFrame(()=>{
      const chapter=parseInt(chapterSel.value,10);
      if(targetVerse)selectVerse(chapter,targetVerse,true);else jumpChapter(chapter,true);
    });
  }

  function setupChapterObserver(){
    if(chapterObserver)chapterObserver.disconnect();
    chapterObserver=new IntersectionObserver(entries=>{
      const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
      if(!visible)return;
      const chapter=parseInt(visible.target.dataset.chapter,10);
      if(String(chapterSel.value)!==String(chapter)){
        chapterSel.value=String(chapter);
        fillVerseSelector(chapter,null);
        locationLabel.textContent=`${currentBook[2]} ${chapter}`;
        saveLocation(chapter,null);
      }
    },{rootMargin:'-180px 0px -58% 0px',threshold:[0,.2,.5,.8]});
    reader.querySelectorAll('.chapter').forEach(c=>chapterObserver.observe(c));
  }

  function jumpChapter(chapter,smooth){
    document.querySelectorAll('.verse.selected').forEach(v=>v.classList.remove('selected'));
    const target=document.getElementById(`chapter-${chapter}`);if(!target)return;
    locationLabel.textContent=`${currentBook[2]} ${chapter}`;
    fillVerseSelector(chapter,null);
    saveLocation(chapter,null);
    target.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'});
  }

  function selectVerse(chapter,verse,smooth){
    document.querySelectorAll('.verse.selected').forEach(v=>v.classList.remove('selected'));
    const target=document.getElementById(`verse-${chapter}-${verse}`);if(!target)return;
    chapterSel.value=String(chapter);fillVerseSelector(chapter,verse);verseSel.value=String(verse);
    target.classList.add('selected');locationLabel.textContent=`${currentBook[2]} ${chapter}:${verse}`;saveLocation(chapter,verse);
    target.scrollIntoView({behavior:smooth?'smooth':'auto',block:'center'});
  }

  function saveLocation(chapter,verse){try{localStorage.setItem('gria_ayt_location',JSON.stringify({book:parseInt(bookSel.value,10),chapter,verse:verse||null}))}catch(_){}}

  bookSel.addEventListener('change',()=>{renderBook(1,null);window.scrollTo({top:0,behavior:'smooth'})});
  chapterSel.addEventListener('change',()=>jumpChapter(parseInt(chapterSel.value,10),true));
  verseSel.addEventListener('change',()=>{const chapter=parseInt(chapterSel.value,10);if(verseSel.value)selectVerse(chapter,parseInt(verseSel.value,10),true);else jumpChapter(chapter,true)});
})();
</script>
<script src="pwa.js" defer></script>
</body>
</html>
