<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c" id="themeColor">
<title>Alkitab — GRIA Pemulihan Palu</title>
<meta name="description" content="Alkitab GRIA: AYT, Hebrew WLC, Greek SBLGNT, dan akses resmi NIV.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&family=Noto+Sans+Hebrew:wght@400;600;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
html{scroll-behavior:smooth}
body{
  --b-bg:#09090b;--b-surface:#111114;--b-surface-2:#17171a;
  --b-border:rgba(255,255,255,.075);--b-border-strong:rgba(255,255,255,.12);
  --b-text:#f2f2f3;--b-muted:#898a91;--b-soft:#67686e;
  --b-accent:#ccff00;--b-accent-soft:rgba(204,255,0,.075);
  --b-shadow:0 22px 60px rgba(0,0,0,.22);
  background:radial-gradient(circle at 50% -8%,rgba(204,255,0,.07),transparent 30%),var(--b-bg);
  color:var(--b-text);font-family:Manrope,Inter,sans-serif;
  transition:background .3s ease,color .3s ease;
}
body[data-bible-theme="light"]{
  --b-bg:#f5f5f1;--b-surface:#fff;--b-surface-2:#efefeb;
  --b-border:rgba(15,15,18,.08);--b-border-strong:rgba(15,15,18,.13);
  --b-text:#171719;--b-muted:#66676d;--b-soft:#85868b;
  --b-accent:#9fc900;--b-accent-soft:rgba(159,201,0,.11);
  --b-shadow:0 20px 50px rgba(24,24,28,.09);
  background:radial-gradient(circle at 50% -8%,rgba(159,201,0,.11),transparent 30%),var(--b-bg);
}
body[data-bible-theme="light"] .navbar{background:rgba(245,245,241,.91)!important;border-color:rgba(15,15,18,.08)!important}
body[data-bible-theme="light"] .navbar .logo{color:#171719!important}

.b-wrap{max-width:900px;margin:0 auto;padding:88px var(--pad) 120px;position:relative;z-index:2}
.b-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.b-back{display:inline-flex;align-items:center;min-height:42px;padding:9px 13px;border-radius:999px;color:var(--b-text);background:var(--b-surface);border:1px solid var(--b-border);font:700 11.5px Manrope,sans-serif}
.theme-toggle{min-height:42px;display:inline-flex;align-items:center;gap:5px;padding:5px;border-radius:999px;background:var(--b-surface);border:1px solid var(--b-border)}
.theme-toggle button{min-width:58px;min-height:32px;padding:6px 9px;border-radius:999px;color:var(--b-muted);font:800 10px Manrope,sans-serif}
.theme-toggle button.active{color:#09090b;background:var(--b-accent)}

.b-head{margin-bottom:18px}
.b-kicker{display:flex;align-items:center;gap:7px;color:var(--b-accent);font:800 10.5px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.1em}
.b-kicker:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--b-accent)}
.b-head h1{font:800 clamp(36px,9vw,55px)/1 Syne,sans-serif;letter-spacing:-.05em;margin:10px 0 9px;color:var(--b-text)}
.b-head p{max-width:660px;color:var(--b-muted);font:500 12.8px/1.65 Manrope,sans-serif}

/* Translation selection scrolls normally */
.version-tabs{
  display:flex;gap:7px;margin:0 -2px 14px;padding:2px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.version-tabs::-webkit-scrollbar{display:none}
.version-tab{
  flex:0 0 auto;min-height:39px;padding:8px 12px;border-radius:999px;
  color:var(--b-muted);background:var(--b-surface);
  border:1px solid var(--b-border);font:800 10px Manrope,sans-serif;
  transition:transform .18s ease,background .18s ease,color .18s ease;
}
.version-tab.active{color:#09090b;background:var(--b-accent);border-color:var(--b-accent)}
.version-tab:active{transform:scale(.97)}
.version-tab small{opacity:.68;font-size:8px}

/* Robust iPhone freeze: JavaScript switches only Kitab + Pasal to fixed. */
.b-controls-anchor{position:relative;min-height:62px;margin:0 0 13px}
.b-controls{
  position:relative;z-index:45;padding:9px;border-radius:18px;
  background:rgba(17,17,20,.95);border:1px solid var(--b-border);
  box-shadow:0 12px 34px rgba(0,0,0,.15);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
body[data-bible-theme="light"] .b-controls{background:rgba(255,255,255,.96)}
.b-controls.is-frozen{
  position:fixed;z-index:9500;margin:0!important;
  box-shadow:0 14px 40px rgba(0,0,0,.25);
  border-color:color-mix(in srgb,var(--b-accent) 20%,var(--b-border));
}
.b-controls.is-frozen:after{
  content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  border-radius:999px;background:linear-gradient(90deg,var(--b-accent),transparent 70%);
  opacity:.7
}
.b-selects{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(112px,.72fr);gap:7px}
.b-selects select,.verse-jump select{
  width:100%;min-width:0;min-height:43px;padding:9px 10px;border-radius:13px;
  color:var(--b-text);background:var(--b-bg);border:1px solid var(--b-border-strong);
  outline:none;font:700 11px Manrope,sans-serif;
}
.verse-jump{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:10px 12px;border-radius:16px;background:var(--b-surface);border:1px solid var(--b-border)}
.verse-jump label{color:var(--b-muted);font:800 9.5px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.verse-jump select{max-width:210px;min-height:38px}

.b-status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px;color:var(--b-muted);font:700 9.5px Manrope,sans-serif}
.b-status strong{color:var(--b-accent)}

.reader-shell{position:relative;overflow:hidden;border-radius:25px;background:var(--b-surface);border:1px solid var(--b-border);box-shadow:var(--b-shadow)}
.chapter-stage{will-change:transform,opacity;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s ease}
.chapter-stage.out-left{transform:translateX(-28px);opacity:0}
.chapter-stage.out-right{transform:translateX(28px);opacity:0}
.chapter-stage.in-right{animation:inRight .34s cubic-bezier(.2,.8,.2,1)}
.chapter-stage.in-left{animation:inLeft .34s cubic-bezier(.2,.8,.2,1)}
@keyframes inRight{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes inLeft{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}

.chapter{padding:21px 17px 17px}
.chapter-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid var(--b-border)}
.chapter-head h2{color:var(--b-text);font:800 23px/1.1 Syne,sans-serif;letter-spacing:-.035em}
.chapter-head span{color:var(--b-soft);font:800 9px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.chapter-title{margin:0 0 14px;padding:11px 12px;border-radius:13px;color:color-mix(in srgb,var(--b-accent) 72%,var(--b-text));background:var(--b-accent-soft);border:1px solid color-mix(in srgb,var(--b-accent) 17%,transparent);font:700 11px/1.5 Manrope,sans-serif}
.verse-list{display:grid;gap:2px}
.verse{display:grid;grid-template-columns:31px 1fr;gap:10px;padding:10px 9px;border-radius:13px;border:1px solid transparent;scroll-margin-top:24px;transition:.2s ease}
.verse.selected{background:var(--b-accent-soft);border-color:color-mix(in srgb,var(--b-accent) 22%,transparent);transform:translateX(2px)}
.vnum{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:9px;color:color-mix(in srgb,var(--b-accent) 70%,var(--b-text));background:var(--b-accent-soft);font:800 9.5px Manrope,sans-serif}
.verse.selected .vnum{color:#09090b;background:var(--b-accent)}
.vtext{color:var(--b-text);font:500 14.5px/1.76 Manrope,sans-serif}
.reader-shell[data-script="hebrew"] .vtext{font-family:'Noto Sans Hebrew',sans-serif;font-size:19px;line-height:1.85;direction:rtl;text-align:right}
.reader-shell[data-script="greek"] .vtext{font-family:'Noto Serif',serif;font-size:16.5px;line-height:1.85}

.chapter-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 15px 16px;border-top:1px solid var(--b-border);background:var(--b-surface-2)}
.chapter-nav button{min-height:42px;padding:9px 12px;border-radius:13px;color:var(--b-text);background:var(--b-surface);border:1px solid var(--b-border);font:800 10.5px Manrope,sans-serif}
.chapter-nav button:last-child{text-align:right}.chapter-nav button:disabled{opacity:.3}
.chapter-index{text-align:center;color:var(--b-muted);font:800 9.5px Manrope,sans-serif;white-space:nowrap}
.swipe-hint{text-align:center;margin:12px 0 0;color:var(--b-soft);font:700 9.5px Manrope,sans-serif}.swipe-hint span{color:var(--b-accent)}

.b-loading,.source-error,.niv-panel{padding:38px 21px;text-align:center;color:var(--b-muted);font:600 12px/1.65 Manrope,sans-serif}
.pulse{display:inline-flex;gap:5px;margin-bottom:9px}.pulse i{width:6px;height:6px;border-radius:50%;background:var(--b-accent);animation:pulse 1s ease-in-out infinite}.pulse i:nth-child(2){animation-delay:.14s}.pulse i:nth-child(3){animation-delay:.28s}
@keyframes pulse{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.retry-btn,.niv-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:15px;padding:9px 15px;border-radius:13px;background:var(--b-accent);color:#09090b;font:800 11px Manrope,sans-serif}
.niv-panel h2{color:var(--b-text);font:800 22px Syne,sans-serif;margin-bottom:8px}
.niv-badge{display:inline-flex;margin-bottom:12px;padding:6px 9px;border-radius:999px;color:var(--b-accent);background:var(--b-accent-soft);font:800 9px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.07em}

.b-source{margin-top:18px;padding:14px 15px;border-radius:15px;color:var(--b-soft);background:var(--b-surface);border:1px solid var(--b-border);font:500 10.5px/1.6 Manrope,sans-serif}
.b-source a{color:var(--b-accent);text-decoration:underline}

.access-lock{max-width:500px;margin:45px auto 0;padding:27px 22px;border-radius:26px;background:var(--b-surface);border:1px solid var(--b-border)}
.access-lock h1{font:800 30px Syne,sans-serif}.access-lock p{margin-top:10px;color:var(--b-muted);font:500 13px/1.6 Manrope,sans-serif}
.access-lock a{display:flex;margin-top:18px;min-height:48px;align-items:center;justify-content:center;border-radius:14px;background:var(--b-accent);color:#050505;font:800 12px Manrope,sans-serif}

@media(max-width:600px){
  .b-wrap{padding-top:82px}.theme-toggle button{min-width:52px}
  .b-controls-anchor{margin-left:-2px;margin-right:-2px}
  .b-selects{grid-template-columns:minmax(0,1.35fr) minmax(104px,.72fr)}
  .verse-jump select{max-width:185px}
  .chapter{padding:18px 13px 14px}.chapter-head h2{font-size:21px}
  .vtext{font-size:14px;line-height:1.74}.verse{padding:9px 6px}
  .reader-shell[data-script="hebrew"] .vtext{font-size:18px}
}
</style>
</head>
<body data-bible-theme="dark">
<nav class="navbar"><div class="navbar-inner"><a href="index.html" class="logo">GRI<span>A</span></a></div></nav>
<main class="b-wrap" id="root"></main>

<script>
(function(){
'use strict';

const ACCESS_KEY='gria_member_access_v1';
const THEME_KEY='gria_bible_theme_v1';
const LOCATION_KEY='gria_multi_bible_location_v1';
const root=document.getElementById('root');
const themeColor=document.getElementById('themeColor');

let ayt=null,currentBook=null,currentChapter=1,selectedVerse=null;
let version='ayt',touchStartX=0,touchStartY=0,changing=false;
const remoteCache=new Map();

const META={
  1:{osis:'GEN',wlc:'Gen'},2:{osis:'EXO',wlc:'Exod'},3:{osis:'LEV',wlc:'Lev'},4:{osis:'NUM',wlc:'Num'},5:{osis:'DEU',wlc:'Deut'},
  6:{osis:'JOS',wlc:'Josh'},7:{osis:'JDG',wlc:'Judg'},8:{osis:'RUT',wlc:'Ruth'},9:{osis:'1SA',wlc:'1Sam'},10:{osis:'2SA',wlc:'2Sam'},
  11:{osis:'1KI',wlc:'1Kgs'},12:{osis:'2KI',wlc:'2Kgs'},13:{osis:'1CH',wlc:'1Chr'},14:{osis:'2CH',wlc:'2Chr'},15:{osis:'EZR',wlc:'Ezra'},
  16:{osis:'NEH',wlc:'Neh'},17:{osis:'EST',wlc:'Esth'},18:{osis:'JOB',wlc:'Job'},19:{osis:'PSA',wlc:'Ps'},20:{osis:'PRO',wlc:'Prov'},
  21:{osis:'ECC',wlc:'Eccl'},22:{osis:'SNG',wlc:'Song'},23:{osis:'ISA',wlc:'Isa'},24:{osis:'JER',wlc:'Jer'},25:{osis:'LAM',wlc:'Lam'},
  26:{osis:'EZK',wlc:'Ezek'},27:{osis:'DAN',wlc:'Dan'},28:{osis:'HOS',wlc:'Hos'},29:{osis:'JOL',wlc:'Joel'},30:{osis:'AMO',wlc:'Amos'},
  31:{osis:'OBA',wlc:'Obad'},32:{osis:'JON',wlc:'Jonah'},33:{osis:'MIC',wlc:'Mic'},34:{osis:'NAM',wlc:'Nah'},35:{osis:'HAB',wlc:'Hab'},
  36:{osis:'ZEP',wlc:'Zeph'},37:{osis:'HAG',wlc:'Hag'},38:{osis:'ZEC',wlc:'Zech'},39:{osis:'MAL',wlc:'Mal'},
  40:{osis:'MAT',sbl:'Matt'},41:{osis:'MRK',sbl:'Mark'},42:{osis:'LUK',sbl:'Luke'},43:{osis:'JHN',sbl:'John'},44:{osis:'ACT',sbl:'Acts'},
  45:{osis:'ROM',sbl:'Rom'},46:{osis:'1CO',sbl:'1Cor'},47:{osis:'2CO',sbl:'2Cor'},48:{osis:'GAL',sbl:'Gal'},49:{osis:'EPH',sbl:'Eph'},
  50:{osis:'PHP',sbl:'Phil'},51:{osis:'COL',sbl:'Col'},52:{osis:'1TH',sbl:'1Thess'},53:{osis:'2TH',sbl:'2Thess'},54:{osis:'1TI',sbl:'1Tim'},
  55:{osis:'2TI',sbl:'2Tim'},56:{osis:'TIT',sbl:'Titus'},57:{osis:'PHM',sbl:'Phlm'},58:{osis:'HEB',sbl:'Heb'},59:{osis:'JAS',sbl:'Jas'},
  60:{osis:'1PE',sbl:'1Pet'},61:{osis:'2PE',sbl:'2Pet'},62:{osis:'1JN',sbl:'1John'},63:{osis:'2JN',sbl:'2John'},64:{osis:'3JN',sbl:'3John'},
  65:{osis:'JUD',sbl:'Jude'},66:{osis:'REV',sbl:'Rev'}
};

function member(){try{return localStorage.getItem(ACCESS_KEY)==='yes'}catch(_){return false}}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function applyTheme(t){
  const theme=t==='light'?'light':'dark';
  document.body.dataset.bibleTheme=theme;
  themeColor.content=theme==='light'?'#f5f5f1':'#0a0a0c';
  try{localStorage.setItem(THEME_KEY,theme)}catch(_){}
  document.querySelectorAll('[data-theme-choice]').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===theme));
}
let savedTheme='dark';try{savedTheme=localStorage.getItem(THEME_KEY)||'dark'}catch(_){}
applyTheme(savedTheme);

if(!member()){
 root.innerHTML='<section class="access-lock"><h1>Fitur Jemaat</h1><p>Alkitab multibahasa tersedia khusus untuk Jemaat GRIA. Masukkan kode jemaat terlebih dahulu.</p><a href="jemaat.html">Masukkan Kode Jemaat</a></section>';
 return;
}

root.innerHTML=`
<div class="b-topbar">
  <a class="b-back" href="jemaat.html">← Kembali</a>
  <div class="theme-toggle"><button data-theme-choice="dark">Dark</button><button data-theme-choice="light">Light</button></div>
</div>
<header class="b-head">
  <div class="b-kicker">Ruang Alkitab Jemaat</div>
  <h1>Alkitab</h1>
  <p>AYT tersedia lokal. TB dan NIV dibuka melalui sumber resmi berlisensi; Hebrew WLC dan Greek SBLGNT dibaca dari repository sumber terbuka.</p>
</header>
<div class="version-tabs" aria-label="Pilih versi Alkitab">
  <button class="version-tab active" data-version="ayt">AYT <small>Indonesia</small></button>
  <button class="version-tab" data-version="tb">TB · LAI <small>resmi ↗</small></button>
  <button class="version-tab" data-version="hebrew">עברית · WLC <small>PL</small></button>
  <button class="version-tab" data-version="greek">Ελληνικά · SBLGNT <small>PB</small></button>
  <button class="version-tab" data-version="niv">NIV® <small>resmi ↗</small></button>
</div>
<div class="b-controls-anchor" id="controlsAnchor">
  <section class="b-controls" id="bibleControls" aria-label="Filter Kitab dan Pasal">
    <div class="b-selects"><select id="bookSel"></select><select id="chapterSel"></select></div>
  </section>
</div>
<div class="verse-jump"><label for="verseSel">Lompat Ayat</label><select id="verseSel"><option value="">Semua ayat</option></select></div>
<div class="b-status"><span id="locationLabel">Memuat...</span><strong id="gestureLabel">Geser ← → antar pasal</strong></div>
<section class="reader-shell" id="readerShell" aria-live="polite">
  <div class="chapter-stage" id="readerStage"><div class="b-loading"><span class="pulse"><i></i><i></i><i></i></span><br>Memuat data Alkitab...</div></div>
  <div class="chapter-nav"><button id="prevChapter">← Sebelumnya</button><span class="chapter-index" id="chapterIndex">—</span><button id="nextChapter">Berikutnya →</button></div>
</section>
<div class="swipe-hint">Swipe horizontal pada bacaan <span>← →</span></div>
<div class="b-source" id="sourceNote"></div>`;

const bookSel=document.getElementById('bookSel'),chapterSel=document.getElementById('chapterSel'),verseSel=document.getElementById('verseSel');
const controlsAnchor=document.getElementById('controlsAnchor'),bibleControls=document.getElementById('bibleControls');
const readerShell=document.getElementById('readerShell'),readerStage=document.getElementById('readerStage');
const prevBtn=document.getElementById('prevChapter'),nextBtn=document.getElementById('nextChapter'),chapterIndex=document.getElementById('chapterIndex');
const locationLabel=document.getElementById('locationLabel'),gestureLabel=document.getElementById('gestureLabel'),sourceNote=document.getElementById('sourceNote');

document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.themeChoice));applyTheme(savedTheme);
document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>switchVersion(b.dataset.version));

setupFrozenControls();

function setupFrozenControls(){
 if(!controlsAnchor||!bibleControls)return;
 function update(){
   const navbar=document.querySelector('.navbar');
   const navBottom=navbar?navbar.getBoundingClientRect().bottom:62;
   const top=Math.max(navBottom+8,66);
   const rect=controlsAnchor.getBoundingClientRect();
   const freeze=rect.top<=top;
   if(freeze){
     controlsAnchor.style.height=bibleControls.offsetHeight+'px';
     bibleControls.classList.add('is-frozen');
     bibleControls.style.top=top+'px';
     bibleControls.style.left=rect.left+'px';
     bibleControls.style.width=rect.width+'px';
   }else{
     bibleControls.classList.remove('is-frozen');
     bibleControls.style.top='';
     bibleControls.style.left='';
     bibleControls.style.width='';
     controlsAnchor.style.height='';
   }
 }
 let busy=false;
 const schedule=()=>{if(busy)return;busy=true;requestAnimationFrame(()=>{update();busy=false})};
 window.addEventListener('scroll',schedule,{passive:true});
 window.addEventListener('resize',schedule,{passive:true});
 window.addEventListener('orientationchange',()=>setTimeout(schedule,180),{passive:true});
 schedule();
}

fetch('ayt-data.min.json',{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('AYT data missing');return r.json()}).then(data=>{
 ayt=data;init();
}).catch(e=>{readerStage.innerHTML='<div class="source-error">Data AYT lokal belum dapat dibuka. Pastikan <strong>ayt-data.min.json</strong> masih ada di repository.</div>';console.error(e)});

function init(){
 ayt.books.forEach(book=>{const o=document.createElement('option');o.value=book[0];o.textContent=book[2];bookSel.appendChild(o)});
 let saved={};try{saved=JSON.parse(localStorage.getItem(LOCATION_KEY)||'{}')}catch(_){}
 version=['ayt','tb','hebrew','greek','niv'].includes(saved.version)?saved.version:'ayt';
 bookSel.value=ayt.books.some(b=>String(b[0])===String(saved.book))?String(saved.book):'43';
 ensureBookForVersion();
 currentBook=getAytBook();
 currentChapter=parseInt(saved.chapter||1,10);
 if(!currentBook[3].some(ch=>ch[0]===currentChapter))currentChapter=currentBook[3][0][0];
 selectedVerse=parseInt(saved.verse||0,10)||null;
 setActiveTab();fillChapterSelector();
 loadCurrentSource('none');
}

function getAytBook(){return ayt.books.find(b=>String(b[0])===String(bookSel.value))}
function getBookId(){return parseInt(bookSel.value,10)}
function setActiveTab(){document.querySelectorAll('[data-version]').forEach(b=>b.classList.toggle('active',b.dataset.version===version))}
function ensureBookForVersion(){
 const id=getBookId();
 if(version==='hebrew'&&id>39)bookSel.value='1';
 if(version==='greek'&&id<40)bookSel.value='40';
}
function fillChapterSelector(){
 currentBook=getAytBook();chapterSel.innerHTML='';
 currentBook[3].forEach(ch=>{const o=document.createElement('option');o.value=ch[0];o.textContent='Pasal '+ch[0];chapterSel.appendChild(o)});
 if(!currentBook[3].some(ch=>ch[0]===currentChapter))currentChapter=currentBook[3][0][0];
 chapterSel.value=String(currentChapter);
}
function fillVerseSelector(chapter){
 verseSel.innerHTML='<option value="">Semua ayat</option>';
 if(!chapter)return;
 chapter[1].forEach(v=>{const o=document.createElement('option');o.value=v[0];o.textContent='Ayat '+v[0];verseSel.appendChild(o)});
 if(selectedVerse&&chapter[1].some(v=>v[0]===selectedVerse))verseSel.value=String(selectedVerse);else{selectedVerse=null;verseSel.value=''}
}
function switchVersion(v){
 version=v;setActiveTab();ensureBookForVersion();currentBook=getAytBook();currentChapter=currentBook[3][0][0];selectedVerse=null;fillChapterSelector();loadCurrentSource('none');saveLocation();
}

async function loadCurrentSource(direction){
 if(version==='tb'){renderTb();return}
 if(version==='niv'){renderNiv();return}
 readerShell.dataset.script=version==='hebrew'?'hebrew':version==='greek'?'greek':'latin';
 readerStage.innerHTML='<div class="b-loading"><span class="pulse"><i></i><i></i><i></i></span><br>Memuat '+(version==='ayt'?'AYT':version==='hebrew'?'Hebrew WLC':'Greek SBLGNT')+'...</div>';
 try{
   let bookData;
   if(version==='ayt')bookData=currentBook[3];
   else if(version==='hebrew')bookData=await loadHebrew(getBookId());
   else bookData=await loadGreek(getBookId());
   const ch=bookData.find(c=>c[0]===currentChapter)||bookData[0];
   currentChapter=ch[0];chapterSel.value=String(currentChapter);fillVerseSelector(ch);renderChapter(ch,direction);
 }catch(e){
   readerStage.innerHTML=`<div class="source-error">Sumber ${version==='hebrew'?'Hebrew WLC':'Greek SBLGNT'} belum dapat dimuat. Pastikan internet aktif.<br><button class="retry-btn" id="retrySource">Coba Lagi</button></div>`;
   document.getElementById('retrySource').onclick=()=>loadCurrentSource('none');console.error(e);
 }
 updateSourceNote();
}

async function loadHebrew(id){
 const key='hebrew-'+id;if(remoteCache.has(key))return remoteCache.get(key);
 const file=META[id]?.wlc;if(!file)throw Error('Hebrew unavailable');
 const url=`https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/${file}.xml`;
 const res=await fetch(url,{cache:'force-cache'});if(!res.ok)throw Error('WLC fetch failed');
 const doc=new DOMParser().parseFromString(await res.text(),'application/xml');
 if(doc.getElementsByTagName('parsererror').length)throw Error('WLC parse failed');
 const map=new Map();
 [...doc.getElementsByTagNameNS('*','verse')].forEach(v=>{
   const ref=v.getAttribute('osisID')||'';const bits=ref.split('.');const ch=+bits[1],num=+bits[2];if(!ch||!num)return;
   const clone=v.cloneNode(true);[...clone.getElementsByTagNameNS('*','note')].forEach(n=>n.remove());
   let txt=(clone.textContent||'').replace(/\s+/g,' ').trim().replace(/\s*\/\s*/g,'');
   if(!map.has(ch))map.set(ch,[]);map.get(ch).push([num,txt,'']);
 });
 const data=[...map.entries()].sort((a,b)=>a[0]-b[0]);remoteCache.set(key,data);return data;
}

async function loadGreek(id){
 const key='greek-'+id;if(remoteCache.has(key))return remoteCache.get(key);
 const file=META[id]?.sbl;if(!file)throw Error('Greek unavailable');
 const url=`https://raw.githubusercontent.com/Faithlife/SBLGNT/master/data/sblgnt/text/${file}.txt`;
 const res=await fetch(url,{cache:'force-cache'});if(!res.ok)throw Error('SBLGNT fetch failed');
 const map=new Map();
 (await res.text()).split(/\r?\n/).forEach(line=>{
   const m=line.match(/^.*?\s(\d+):(\d+)\t(.+)$/);if(!m)return;
   const ch=+m[1],num=+m[2],txt=m[3].trim();if(!map.has(ch))map.set(ch,[]);map.get(ch).push([num,txt,'']);
 });
 const data=[...map.entries()].sort((a,b)=>a[0]-b[0]);if(!data.length)throw Error('SBLGNT parse failed');remoteCache.set(key,data);return data;
}

function renderChapter(ch,direction){
 const firstTitle=ch[1].find(v=>v[2])?.[2]||'';
 readerStage.innerHTML=`<article class="chapter"><div class="chapter-head"><h2>${esc(currentBook[2])} ${ch[0]}</h2><span>${ch[1].length} ayat</span></div>${firstTitle?`<div class="chapter-title">${esc(firstTitle)}</div>`:''}<div class="verse-list">${ch[1].map(v=>`<article class="verse${selectedVerse===v[0]?' selected':''}" data-verse="${v[0]}" id="verse-${v[0]}"><div class="vnum">${v[0]}</div><div class="vtext">${esc(v[1])}</div></article>`).join('')}</div></article>`;
 readerStage.className='chapter-stage '+(direction==='next'?'in-right':direction==='prev'?'in-left':'');
 readerStage.querySelectorAll('.verse').forEach(el=>el.onclick=()=>{selectedVerse=+el.dataset.verse;readerStage.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');verseSel.value=String(selectedVerse);updateMeta();saveLocation()});
 updateMeta();saveLocation();
 if(selectedVerse){const target=document.getElementById('verse-'+selectedVerse);if(target)setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'center'}),80)}
}

function renderTb(){
 readerShell.dataset.script='latin';
 fillVerseSelector(currentBook[3].find(c=>c[0]===currentChapter));
 const ref=(META[getBookId()]||{}).osis||'JHN';
 const suffix=selectedVerse?`${ref}.${currentChapter}.${selectedVerse}.TB`:`${ref}.${currentChapter}.TB`;
 const officialUrl=`https://www.bible.com/id/bible/306/${suffix}`;
 readerStage.innerHTML=`<div class="niv-panel">
   <span class="niv-badge">TB · Lembaga Alkitab Indonesia</span>
   <h2>Alkitab Terjemahan Baru</h2>
   <p>TB adalah teks resmi LAI dan dilindungi hak cipta. GRIA tidak menyalin full-text TB ke repository. Referensi yang sama dibuka dari sumber resmi berlisensi.</p>
   <a class="niv-btn" href="${officialUrl}" target="_blank" rel="noopener">Buka ${esc(currentBook[2])} ${currentChapter}${selectedVerse?':'+selectedVerse:''} TB ↗</a>
   <a class="niv-btn" style="margin-left:7px;background:var(--b-surface-2);color:var(--b-text);border:1px solid var(--b-border)" href="https://bible-api.alkitab.or.id/" target="_blank" rel="noopener">LAI Bible API ↗</a>
 </div>`;
 updateMeta();updateSourceNote();saveLocation();
}

function renderNiv(){
 readerShell.dataset.script='latin';fillVerseSelector(currentBook[3].find(c=>c[0]===currentChapter));
 const meta=META[getBookId()]||{};const ref=meta.osis||'JHN';
 const suffix=selectedVerse?`${ref}.${currentChapter}.${selectedVerse}.NIV`:`${ref}.${currentChapter}.NIV`;
 const url=`https://www.bible.com/bible/111/${suffix}`;
 readerStage.innerHTML=`<div class="niv-panel"><span class="niv-badge">NIV® · licensed text</span><h2>Buka NIV dari sumber resmi</h2><p>GRIA tidak menyimpan salinan penuh NIV di repository karena NIV dilindungi hak cipta Biblica. Gunakan tombol di bawah untuk membaca referensi yang sama melalui YouVersion.</p><a class="niv-btn" href="${url}" target="_blank" rel="noopener">Buka ${esc(currentBook[2])} ${currentChapter}${selectedVerse?':'+selectedVerse:''} NIV® ↗</a></div>`;
 updateMeta();updateSourceNote();saveLocation();
}

function updateMeta(){
 const idx=currentBook[3].findIndex(ch=>ch[0]===currentChapter);
 chapterIndex.textContent=`${idx+1} / ${currentBook[3].length}`;prevBtn.disabled=idx<=0;nextBtn.disabled=idx>=currentBook[3].length-1;
 locationLabel.textContent=`${version==='ayt'?'AYT':version==='tb'?'TB · LAI':version==='hebrew'?'WLC':version==='greek'?'SBLGNT':'NIV®'} · ${currentBook[2]} ${currentChapter}${selectedVerse?':'+selectedVerse:''}`;
 gestureLabel.textContent=(version==='niv'||version==='tb')?'Dibuka dari sumber resmi ↗':'Geser ← → antar pasal';
}
function updateSourceNote(){
 if(version==='ayt')sourceNote.innerHTML='Teks: <strong>Alkitab Yang Terbuka (AYT)</strong> © YLSA-AYT 2011–2024. <a href="AYT-LICENSE.html" target="_blank">Lisensi AYT</a>.';
 else if(version==='tb')sourceNote.innerHTML='TB: <strong>Alkitab Terjemahan Baru</strong> © Lembaga Alkitab Indonesia. Full text tidak disalin ke repository GRIA. Integrasi penuh dapat dilakukan melalui <a href="https://bible-api.alkitab.or.id/" target="_blank" rel="noopener">Bible API resmi LAI ↗</a> setelah memperoleh akses dan izin.';
 else if(version==='hebrew')sourceNote.innerHTML='Hebrew: <strong>Open Scriptures Hebrew Bible / Westminster Leningrad Codex</strong>. Teks WLC public domain; anotasi OSHB CC BY 4.0. <a href="https://github.com/openscriptures/morphhb" target="_blank" rel="noopener">Repository sumber ↗</a>.';
 else if(version==='greek')sourceNote.innerHTML='Greek: <strong>SBL Greek New Testament (SBLGNT)</strong>, Society of Biblical Literature / Logos Bible Software, CC BY 4.0. <a href="https://github.com/Faithlife/SBLGNT" target="_blank" rel="noopener">Repository sumber ↗</a>.';
 else sourceNote.innerHTML='NIV® adalah merek terdaftar Biblica. GRIA tidak mendistribusikan full text NIV; referensi dibuka melalui YouVersion.';
}
function saveLocation(){try{localStorage.setItem(LOCATION_KEY,JSON.stringify({version,book:+bookSel.value,chapter:currentChapter,verse:selectedVerse||null}))}catch(_){}}

async function changeChapter(delta){
 if(changing||version==='niv'&&false)return;
 const idx=currentBook[3].findIndex(ch=>ch[0]===currentChapter),next=idx+delta;if(next<0||next>=currentBook[3].length)return;
 changing=true;readerStage.classList.add(delta>0?'out-left':'out-right');
 setTimeout(()=>{currentChapter=currentBook[3][next][0];selectedVerse=null;chapterSel.value=String(currentChapter);loadCurrentSource(delta>0?'next':'prev').finally(()=>{changing=false;setTimeout(()=>readerShell.scrollIntoView({behavior:'smooth',block:'start'}),50)})},190);
}

bookSel.onchange=()=>{ensureBookForVersion();currentBook=getAytBook();currentChapter=currentBook[3][0][0];selectedVerse=null;fillChapterSelector();loadCurrentSource('none')};
chapterSel.onchange=()=>{currentChapter=+chapterSel.value;selectedVerse=null;loadCurrentSource('none')};
verseSel.onchange=()=>{selectedVerse=verseSel.value?+verseSel.value:null;if(version==='tb')renderTb();else if(version==='niv')renderNiv();else loadCurrentSource('none')};
prevBtn.onclick=()=>changeChapter(-1);nextBtn.onclick=()=>changeChapter(1);

readerShell.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});
readerShell.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)<58||Math.abs(dx)<Math.abs(dy)*1.25)return;changeChapter(dx<0?1:-1)},{passive:true});

})();
</script>
<script src="pwa.js" defer></script>
