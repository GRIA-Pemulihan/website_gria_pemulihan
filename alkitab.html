<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Alkitab — GRIA Pemulihan Palu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&family=Noto+Sans+Hebrew:wght@400;600;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at 50% -5%,rgba(204,255,0,.07),transparent 27%),var(--bg-base)}
.b-wrap{max-width:980px;margin:0 auto;padding:100px var(--pad) 120px;position:relative;z-index:2}.b-head{margin-bottom:24px}.b-head h1{font:800 clamp(34px,7vw,52px)/1.02 Syne,sans-serif;letter-spacing:-.045em}.b-head p{max-width:650px;margin-top:10px;color:#8e8f95;font:500 13px/1.65 Manrope,sans-serif}
.b-controls{position:sticky;top:72px;z-index:30;padding:12px;margin:0 0 20px;border-radius:20px;background:rgba(14,14,17,.88);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.16)}
.b-selects{display:grid;grid-template-columns:1.6fr .7fr;gap:8px}.b-selects select{width:100%;min-height:44px;padding:10px 12px;border-radius:13px;color:#eee;background:#08080a;border:1px solid rgba(255,255,255,.09);font:700 12px Manrope,sans-serif;outline:none}
.lang-tabs{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none}.lang-tabs::-webkit-scrollbar{display:none}.lang-tab{flex:0 0 auto;min-height:38px;padding:8px 11px;border-radius:999px;color:#93949a;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);font:800 10.5px Manrope,sans-serif;transition:.2s ease}.lang-tab.active{color:#050505;background:var(--neon);border-color:var(--neon)}.lang-tab:disabled{opacity:.34}
.b-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 10px}.b-meta h2{font:800 20px Manrope,sans-serif;letter-spacing:-.03em}.b-meta span{color:#73747a;font:700 10px Manrope,sans-serif}
.b-reader{display:grid;gap:9px}.verse{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:15px 16px;border-radius:17px;background:linear-gradient(155deg,#121215,#0d0d0f);border:1px solid rgba(255,255,255,.055);opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s cubic-bezier(.2,.8,.2,1),border-color .2s ease}.verse.show{opacity:1;transform:translateY(0)}.verse:active{border-color:rgba(204,255,0,.18)}
.vnum{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--neon);background:rgba(204,255,0,.07);font:800 10px Manrope,sans-serif}.vtext{color:#ededee;font:500 15px/1.75 Manrope,sans-serif}.vtext.hebrew{font-family:'Noto Sans Hebrew',sans-serif;font-size:20px;line-height:1.8;text-align:right;direction:rtl}.vtext.greek{font-family:'Noto Serif',serif;font-size:17px;line-height:1.8}
.loading,.empty{padding:34px 20px;border-radius:20px;color:#8d8e94;background:#111114;border:1px solid rgba(255,255,255,.06);text-align:center;font:600 12px/1.6 Manrope,sans-serif}.source-note{margin-top:18px;padding:14px 15px;border-radius:15px;color:#73747a;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);font:500 10.5px/1.6 Manrope,sans-serif}.source-note a{color:#a8d400;text-decoration:underline}
.access-lock{max-width:500px;margin:50px auto 0;padding:26px 22px;border-radius:26px;background:#111114;border:1px solid rgba(255,255,255,.07)}.access-lock h1{font:800 30px/1.05 Syne,sans-serif}.access-lock p{margin-top:10px;color:#8e8f95;font:500 13px/1.6 Manrope,sans-serif}.access-lock a{display:flex;margin-top:18px;min-height:48px;align-items:center;justify-content:center;border-radius:14px;background:var(--neon);color:#050505;font:800 12px Manrope,sans-serif}
@media(max-width:768px){.b-wrap{padding-top:84px}.b-controls{top:66px}.b-head p{font-size:12.5px}.vtext{font-size:14px}}
</style>
</head>
<body>
<nav class="navbar"><div class="navbar-inner"><a href="index.html" class="logo">GRI<span>A</span></a></div></nav>
<main class="b-wrap" id="root"></main>
<script>
(function(){
  const ACCESS_KEY='gria_member_access_v1';
  const root=document.getElementById('root');
  const BOOKS=[['GEN','Kejadian',50,'old'],['EXO','Keluaran',40,'old'],['LEV','Imamat',27,'old'],['NUM','Bilangan',36,'old'],['DEU','Ulangan',34,'old'],['JOS','Yosua',24,'old'],['JDG','Hakim-hakim',21,'old'],['RUT','Rut',4,'old'],['1SA','1 Samuel',31,'old'],['2SA','2 Samuel',24,'old'],['1KI','1 Raja-raja',22,'old'],['2KI','2 Raja-raja',25,'old'],['1CH','1 Tawarikh',29,'old'],['2CH','2 Tawarikh',36,'old'],['EZR','Ezra',10,'old'],['NEH','Nehemia',13,'old'],['EST','Ester',10,'old'],['JOB','Ayub',42,'old'],['PSA','Mazmur',150,'old'],['PRO','Amsal',31,'old'],['ECC','Pengkhotbah',12,'old'],['SNG','Kidung Agung',8,'old'],['ISA','Yesaya',66,'old'],['JER','Yeremia',52,'old'],['LAM','Ratapan',5,'old'],['EZK','Yehezkiel',48,'old'],['DAN','Daniel',12,'old'],['HOS','Hosea',14,'old'],['JOL','Yoel',3,'old'],['AMO','Amos',9,'old'],['OBA','Obaja',1,'old'],['JON','Yunus',4,'old'],['MIC','Mikha',7,'old'],['NAM','Nahum',3,'old'],['HAB','Habakuk',3,'old'],['ZEP','Zefanya',3,'old'],['HAG','Hagai',2,'old'],['ZEC','Zakharia',14,'old'],['MAL','Maleakhi',4,'old'],['MAT','Matius',28,'new'],['MRK','Markus',16,'new'],['LUK','Lukas',24,'new'],['JHN','Yohanes',21,'new'],['ACT','Kisah Para Rasul',28,'new'],['ROM','Roma',16,'new'],['1CO','1 Korintus',16,'new'],['2CO','2 Korintus',13,'new'],['GAL','Galatia',6,'new'],['EPH','Efesus',6,'new'],['PHP','Filipi',4,'new'],['COL','Kolose',4,'new'],['1TH','1 Tesalonika',5,'new'],['2TH','2 Tesalonika',3,'new'],['1TI','1 Timotius',6,'new'],['2TI','2 Timotius',4,'new'],['TIT','Titus',3,'new'],['PHM','Filemon',1,'new'],['HEB','Ibrani',13,'new'],['JAS','Yakobus',5,'new'],['1PE','1 Petrus',5,'new'],['2PE','2 Petrus',3,'new'],['1JN','1 Yohanes',5,'new'],['2JN','2 Yohanes',1,'new'],['3JN','3 Yohanes',1,'new'],['JUD','Yudas',1,'new'],['REV','Wahyu',22,'new']];
  function member(){try{return localStorage.getItem(ACCESS_KEY)==='yes'}catch(_){return false}}
  if(!member()){root.innerHTML='<section class="access-lock"><h1>Fitur Jemaat</h1><p>Alkitab multibahasa tersedia khusus untuk Jemaat GRIA. Masukkan kode jemaat terlebih dahulu.</p><a href="jemaat.html">Masukkan Kode Jemaat</a></section>';return}
  root.innerHTML=`<header class="b-head"><h1>Alkitab</h1><p>Baca dan bandingkan teks Bahasa Inggris, Ibrani Perjanjian Lama, dan Yunani Perjanjian Baru.</p></header><section class="b-controls"><div class="b-selects"><select id="bookSel" aria-label="Pilih kitab"></select><select id="chapterSel" aria-label="Pilih pasal"></select></div><div class="lang-tabs"><button class="lang-tab active" data-lang="kjv">English · KJV</button><button class="lang-tab" data-lang="wlc">עברית · WLC</button><button class="lang-tab" data-lang="tr">Ελληνικά · TR</button></div></section><div class="b-meta"><h2 id="chapterTitle">Yohanes 3</h2><span id="langLabel">English · KJV</span></div><section class="b-reader" id="reader"><div class="loading">Memuat teks Alkitab...</div></section><div class="source-note">Sumber teks publik: KJV (English), Westminster Leningrad Codex/WLC (Hebrew, Perjanjian Lama), dan Textus Receptus/TR (Greek, Perjanjian Baru) melalui <a href="https://originsapi.com/" target="_blank" rel="noopener">OriginsAPI</a>.</div>`;
  const bookSel=document.getElementById('bookSel'),chapterSel=document.getElementById('chapterSel'),reader=document.getElementById('reader'),tabs=[...document.querySelectorAll('.lang-tab')];let lang='kjv';
  BOOKS.forEach(([code,name])=>{const o=document.createElement('option');o.value=code;o.textContent=name;bookSel.appendChild(o)});bookSel.value='JHN';
  function bookInfo(){return BOOKS.find(b=>b[0]===bookSel.value)}
  function fillChapters(){const [,name,count,testament]=bookInfo();chapterSel.innerHTML='';for(let i=1;i<=count;i++){const o=document.createElement('option');o.value=i;o.textContent='Pasal '+i;chapterSel.appendChild(o)}chapterSel.value=Math.min(parseInt(chapterSel.dataset.last||'3',10),count);updateTabs(testament)}
  function updateTabs(testament){tabs.forEach(btn=>{const l=btn.dataset.lang;btn.disabled=(l==='wlc'&&testament!=='old')||(l==='tr'&&testament!=='new')});if((lang==='wlc'&&testament!=='old')||(lang==='tr'&&testament!=='new'))lang='kjv';tabs.forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===lang))}
  async function load(){const [code,name,,testament]=bookInfo();updateTabs(testament);const chapter=chapterSel.value;document.getElementById('chapterTitle').textContent=name+' '+chapter;const labels={kjv:'English · KJV',wlc:'Hebrew · WLC',tr:'Greek · TR'};document.getElementById('langLabel').textContent=labels[lang];reader.innerHTML='<div class="loading">Memuat teks Alkitab...</div>';const url=`https://bible-${lang}.originsapi.com/${code}.${chapter}.json`;try{const res=await fetch(url,{cache:'force-cache'});if(!res.ok)throw new Error('not available');const data=await res.json();if(!Array.isArray(data)||!data.length)throw new Error('empty');reader.innerHTML='';data.forEach((v,i)=>{const el=document.createElement('article');el.className='verse';const extra=lang==='wlc'?' hebrew':lang==='tr'?' greek':'';el.innerHTML=`<div class="vnum">${v.verse}</div><div class="vtext${extra}">${escapeHtml(v.text||'')}</div>`;reader.appendChild(el);setTimeout(()=>el.classList.add('show'),Math.min(i*24,420))})}catch(e){const msg=lang==='wlc'?'Teks WLC tersedia untuk Perjanjian Lama saja.':lang==='tr'?'Teks Textus Receptus tersedia untuk Perjanjian Baru saja.':'Teks belum dapat dimuat. Periksa koneksi internet.';reader.innerHTML=`<div class="empty">${msg}</div>`}}
  tabs.forEach(btn=>btn.addEventListener('click',()=>{if(btn.disabled)return;lang=btn.dataset.lang;tabs.forEach(b=>b.classList.toggle('active',b===btn));load()}));bookSel.addEventListener('change',()=>{chapterSel.dataset.last='1';fillChapters();load()});chapterSel.addEventListener('change',()=>{chapterSel.dataset.last=chapterSel.value;load()});
  function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
  fillChapters();chapterSel.value='3';load();
})();
</script>
<script src="pwa.js" defer></script>
</body>
</html>
