<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <title>GRIA — Sedang Offline</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0a0a0c;color:#ededed;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(520px,100%);background:#111114;border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:34px}.brand{font-size:34px;font-weight:800;letter-spacing:-.04em}.brand span{color:#ccff00}.dot{width:10px;height:10px;border-radius:50%;background:#ccff00;box-shadow:0 0 18px rgba(204,255,0,.45);margin:24px 0}h1{font-size:26px;margin:0 0 12px}p{color:#a8a8ad;line-height:1.65;margin:0 0 24px}button{appearance:none;border:0;border-radius:999px;background:#ccff00;color:#0a0a0a;font-weight:700;padding:13px 20px;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">GRI<span>A</span></div>
    <div class="dot" aria-hidden="true"></div>
    <h1>Koneksi internet sedang tidak tersedia.</h1>
    <p>Beberapa halaman yang pernah dibuka mungkin tetap tersedia. Sambungkan kembali ke internet untuk mendapatkan warta dan informasi jemaat terbaru.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
