<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Jemaat — GRIA Pemulihan Palu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">

<style>
html{scroll-behavior:smooth}
.j-wrap{max-width:900px;margin:0 auto;padding:102px var(--pad) 120px;position:relative;z-index:2}
.j-gate{
  max-width:500px;margin:0 auto;padding:27px 22px;border-radius:25px;
  background:var(--bg-elevated);border:1px solid var(--card-border)
}
.j-brand{color:var(--neon);font:800 10px Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.j-gate h1{margin:12px 0 10px;font:800 clamp(30px,8vw,42px)/1.03 Syne,sans-serif;letter-spacing:-.045em}
.j-gate p{color:var(--text-mute);font:500 12.5px/1.65 Manrope,sans-serif}
.j-field{margin-top:21px}
.j-field label{display:block;margin-bottom:7px;color:var(--text-mute);font:700 11px Manrope,sans-serif}
.j-field input{
  width:100%;min-height:52px;padding:13px 15px;border-radius:14px;
  background:var(--bg-base);color:var(--text);border:1px solid var(--card-border-strong);
  font:600 15px Manrope,sans-serif;outline:none
}
.j-field input:focus{border-color:color-mix(in srgb,var(--neon) 65%,var(--card-border));box-shadow:0 0 0 3px var(--neon-soft)}
.j-btn{width:100%;min-height:49px;margin-top:12px;border-radius:14px;background:var(--neon);color:#050505;font:800 12.5px Manrope,sans-serif}
.j-help{margin-top:13px;color:var(--grey-dim);font:500 10.5px/1.55 Manrope,sans-serif}
.j-error{display:none;margin-top:11px;padding:11px 12px;border-radius:12px;color:#d64d4d;background:rgba(255,70,70,.06);border:1px solid rgba(255,70,70,.14);font:600 11px/1.5 Manrope,sans-serif}
.j-error.show{display:block}

.j-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.j-head h1{font:800 clamp(29px,7vw,43px)/1.05 Syne,sans-serif;letter-spacing:-.04em}
.j-head p{margin-top:5px;color:var(--text-mute);font:500 11.5px/1.5 Manrope,sans-serif}
.j-lock{min-height:38px;padding:7px 11px;border-radius:999px;color:var(--grey);background:var(--bg-elevated);border:1px solid var(--card-border);font:700 10px Manrope,sans-serif}

.j-grid{display:grid;grid-template-columns:1fr;gap:11px}
.j-card{
  position:relative;overflow:hidden;padding:20px;border-radius:20px;
  background:var(--bg-elevated);border:1px solid var(--card-border);
  opacity:0;transform:translateY(11px);
  transition:opacity .35s ease,transform .35s cubic-bezier(.2,.8,.2,1)
}
.j-card.is-visible{opacity:1;transform:translateY(0)}
.j-card h2{margin-bottom:12px;color:var(--grey);font:800 9.5px Manrope,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.j-main-title{font:800 23px/1.06 Syne,sans-serif;letter-spacing:-.035em}
.j-desc{margin-top:7px;color:var(--text-mute);font:500 11.5px/1.6 Manrope,sans-serif}
.j-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.j-chip{padding:5px 8px;border-radius:999px;color:var(--grey);background:var(--bg-soft);border:1px solid var(--card-border);font:700 8.5px Manrope,sans-serif}
.j-primary{display:flex;min-height:44px;margin-top:15px;align-items:center;justify-content:center;border-radius:13px;background:var(--neon);color:#050505;font:800 11px Manrope,sans-serif}
.j-coming{display:inline-flex;padding:5px 8px;border-radius:999px;color:var(--grey);background:var(--bg-soft);border:1px solid var(--card-border);font:800 8px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.j-coming-card{min-height:160px;display:flex;flex-direction:column;justify-content:space-between}
.j-note{color:var(--grey-dim);font:500 10.5px/1.5 Manrope,sans-serif}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.quick a{min-height:43px;display:flex;align-items:center;justify-content:center;padding:9px;border-radius:12px;color:var(--text);background:var(--bg-soft);border:1px solid var(--card-border);font:700 10.5px Manrope,sans-serif}

/* Ayat Hari Ini lives here now */
.daily-verse{
  margin-top:24px;
  padding:20px;
  border-radius:20px;
  background:var(--bg-elevated);
  border:1px solid var(--card-border);
}
.daily-verse-label{
  color:var(--neon-dim);
  font:800 8.5px Manrope,sans-serif;
  text-transform:uppercase;
  letter-spacing:.09em;
}
.daily-verse blockquote{
  margin:13px 0 9px;
  color:var(--text);
  font:700 clamp(17px,5vw,21px)/1.48 Syne,sans-serif;
  letter-spacing:-.025em;
}
.daily-verse cite{
  color:var(--text-mute);
  font:700 9.5px Manrope,sans-serif;
  font-style:normal;
}

@media(min-width:720px){
  .j-grid{grid-template-columns:1.2fr .8fr}
  .j-bible{grid-row:span 2}
  .j-coming-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;grid-column:1/-1}
}
@media(max-width:768px){.j-wrap{padding-top:84px}.j-head{align-items:flex-start}}
</style>
</head>
<body>
<nav class="navbar"><div class="navbar-inner"><a href="index.html" class="logo">GRI<span>A</span></a></div></nav>
<main class="j-wrap" id="root"></main>

<script>
(function(){
  const ACCESS_KEY='gria_member_access_v1';
  const PASSWORD='GRIA2026';
  const root=document.getElementById('root');

  function isMember(){
    try{return localStorage.getItem(ACCESS_KEY)==='yes'}catch(_){return false}
  }

  function showGate(){
    root.innerHTML=`
      <section class="j-gate">
        <div class="j-brand">Khusus Jemaat GRIA Palu</div>
        <h1>Masuk sebagai Jemaat</h1>
        <p>Masukkan kode akses untuk membuka fitur khusus anggota Jemaat GRIA Palu.</p>
        <div class="j-field">
          <label for="memberPass">Kode Jemaat</label>
          <input id="memberPass" type="password" placeholder="Masukkan kode" autocomplete="off">
        </div>
        <button class="j-btn" id="memberBtn">Masuk</button>
        <div class="j-error" id="memberError">Kode belum sesuai. Silakan coba lagi.</div>
        <div class="j-help">Belum mengetahui kode? Tanyakan melalui <strong>grup WhatsApp GRIA</strong>.</div>
      </section>`;

    const input=document.getElementById('memberPass');
    const submit=()=>{
      if(input.value.trim()===PASSWORD){
        try{
          localStorage.setItem(ACCESS_KEY,'yes');
          localStorage.setItem('gria_entry_mode','member');
        }catch(_){}
        renderMember();
      }else{
        document.getElementById('memberError').classList.add('show');
        input.focus();
      }
    };

    document.getElementById('memberBtn').onclick=submit;
    input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
  }

  function revealCards(){
    const cards=document.querySelectorAll('.j-card');
    const io=new IntersectionObserver(entries=>entries.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target)}
    }),{threshold:.12});
    cards.forEach((c,i)=>{c.style.transitionDelay=(i*55)+'ms';io.observe(c)});
  }

  function dailyVerse(){
    const verses=[
      ['Segala perkara dapat kutanggung di dalam Dia yang memberi kekuatan kepadaku.','Filipi 4:13'],
      ['TUHAN adalah gembalaku, takkan kekurangan aku.','Mazmur 23:1'],
      ['Percayalah kepada TUHAN dengan segenap hatimu.','Amsal 3:5'],
      ['Kasih itu sabar; kasih itu murah hati.','1 Korintus 13:4'],
      ['Janganlah hendaknya kamu kuatir tentang apa pun juga.','Filipi 4:6'],
      ['Firman-Mu itu pelita bagi kakiku dan terang bagi jalanku.','Mazmur 119:105'],
      ['Sebab bagi Allah tidak ada yang mustahil.','Lukas 1:37']
    ];
    const d=new Date();
    const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
    return verses[Math.abs(n)%verses.length];
  }

  function renderMember(){
    const verse=dailyVerse();

    root.innerHTML=`
      <header class="j-head">
        <div>
          <h1>Jemaat GRIA</h1>
          <p>Ruang khusus anggota jemaat untuk bertumbuh dan terhubung.</p>
        </div>
        <button class="j-lock" id="lockBtn">Keluar</button>
      </header>

      <div class="j-grid">
        <section class="j-card j-bible">
          <h2>Alkitab</h2>
          <div class="j-main-title">Ruang Alkitab</div>
          <p class="j-desc">Baca AYT, teks Ibrani dan Yunani, serta akses versi resmi lainnya.</p>
          <div class="j-meta">
            <span class="j-chip">AYT</span>
            <span class="j-chip">Hebrew</span>
            <span class="j-chip">Greek</span>
          </div>
          <a class="j-primary" href="alkitab.html">Buka Alkitab</a>
        </section>

        <section class="j-card">
          <h2>Persekutuan</h2>
          <div class="j-main-title" style="font-size:19px">PA & Persekutuan Doa</div>
          <p class="j-desc">Masuk ke ruang persekutuan atau cek jadwal doa terbaru.</p>
          <div class="quick">
            <a href="persekutuan.html">Persekutuan</a>
            <a href="warta.html#informasi-umum">Jadwal Doa</a>
          </div>
        </section>

        <div class="j-coming-row">
          <section class="j-card j-coming-card">
            <div>
              <span class="j-coming">Coming Soon</span>
              <div class="j-main-title" style="font-size:18px;margin-top:13px">Bible Reading Tracker 2027</div>
              <p class="j-desc">Perjalanan baca Alkitab tahunan bersama jemaat.</p>
            </div>
            <div class="j-note">Disiapkan untuk 2027.</div>
          </section>

          <section class="j-card j-coming-card">
            <div>
              <span class="j-coming">Coming Soon</span>
              <div class="j-main-title" style="font-size:18px;margin-top:13px">Bank Ayat Tahunan</div>
              <p class="j-desc">Ayat pilihan yang dibagikan dan dikumpulkan oleh member GRIA.</p>
            </div>
            <div class="j-note">Fitur member sedang dikembangkan.</div>
          </section>
        </div>
      </div>

      <section class="daily-verse">
        <div class="daily-verse-label">Ayat Hari Ini</div>
        <blockquote>“${verse[0]}”</blockquote>
        <cite>${verse[1]}</cite>
      </section>`;

    document.getElementById('lockBtn').onclick=()=>{
      try{
        localStorage.removeItem(ACCESS_KEY);
        localStorage.setItem('gria_entry_mode','guest');
      }catch(_){}
      showGate();
    };

    revealCards();
  }

  if(isMember())renderMember();
  else showGate();
})();
</script>
<script src="pwa.js" defer></script>
</body>
</html>
