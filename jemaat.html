<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Jemaat — GRIA Pemulihan Palu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at 50% -5%,rgba(204,255,0,.08),transparent 30%),var(--bg-base)}
.j-wrap{max-width:900px;margin:0 auto;padding:105px var(--pad) 120px;position:relative;z-index:2}
.j-gate{max-width:500px;margin:0 auto;padding:30px 23px;border-radius:30px;background:radial-gradient(circle at 100% 0%,rgba(204,255,0,.08),transparent 34%),linear-gradient(155deg,#141417,#0d0d0f);border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 70px rgba(0,0,0,.28)}
.j-brand{color:var(--neon);font:800 11px/1.2 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.j-gate h1{font:800 clamp(30px,8vw,44px)/1.03 Syne,sans-serif;margin:13px 0 11px;letter-spacing:-.045em}
.j-gate p{color:#96979d;font:500 13.5px/1.68 Manrope,sans-serif}
.j-field{margin-top:24px}.j-field label{display:block;margin-bottom:7px;color:#bbb;font:700 12px Manrope,sans-serif}
.j-field input{width:100%;min-height:54px;padding:14px 16px;border-radius:16px;background:#08080a;color:#fff;border:1px solid rgba(255,255,255,.1);font:600 16px Manrope,sans-serif;outline:none;transition:.2s ease}
.j-field input:focus{border-color:rgba(204,255,0,.72);box-shadow:0 0 0 4px rgba(204,255,0,.07)}
.j-btn{width:100%;min-height:52px;margin-top:13px;border-radius:16px;background:var(--neon);color:#050505;font:800 14px Manrope,sans-serif;transition:transform .18s ease,box-shadow .18s ease}.j-btn:active{transform:scale(.985)}
.j-help{margin-top:14px;color:#74757b;font:500 11.5px/1.6 Manrope,sans-serif}
.j-error{display:none;margin-top:12px;padding:12px 13px;border-radius:13px;color:#ff9898;background:rgba(255,80,80,.07);border:1px solid rgba(255,80,80,.17);font:600 12px/1.5 Manrope,sans-serif}.j-error.show{display:block}
.j-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:25px}.j-head h1{font:800 clamp(30px,7vw,46px)/1.05 Syne,sans-serif;letter-spacing:-.04em}.j-head p{margin-top:6px;color:#8d8e94;font:500 12.5px/1.55 Manrope,sans-serif}
.j-lock{min-height:40px;padding:8px 12px;border-radius:999px;color:#aaa;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);font:700 11px Manrope,sans-serif}
.j-grid{display:grid;grid-template-columns:1fr;gap:14px}.j-card{position:relative;overflow:hidden;padding:23px;border-radius:23px;background:linear-gradient(155deg,#131316,#0d0d0f);border:1px solid rgba(255,255,255,.075);transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s ease,box-shadow .3s ease;opacity:0;transform:translateY(14px)}
.j-card.is-visible{opacity:1;transform:translateY(0)}.j-card:hover{border-color:rgba(204,255,0,.16);box-shadow:0 18px 40px rgba(0,0,0,.18)}
.j-card:before{content:'';position:absolute;width:170px;height:170px;right:-80px;top:-90px;background:radial-gradient(circle,rgba(204,255,0,.09),transparent 70%);pointer-events:none}
.j-card h2{font:800 12px/1.2 Manrope,sans-serif;color:#a0a1a6;letter-spacing:.09em;text-transform:uppercase;margin-bottom:15px}.j-main-title{font:800 27px/1.05 Syne,sans-serif;letter-spacing:-.035em}.j-desc{margin-top:8px;color:#8d8e94;font:500 12.5px/1.65 Manrope,sans-serif}
.j-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.j-chip{padding:6px 9px;border-radius:999px;color:#bbb;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font:700 9.5px Manrope,sans-serif}
.j-primary{display:flex;min-height:48px;margin-top:18px;align-items:center;justify-content:center;border-radius:14px;background:var(--neon);color:#050505;font:800 12.5px Manrope,sans-serif}
.j-coming{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;color:#8d8e94;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.065);font:800 9px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.08em}.j-coming:before{content:'';width:6px;height:6px;border-radius:50%;background:#777}
.j-coming-card{min-height:180px;display:flex;flex-direction:column;justify-content:space-between}.j-note{color:#7d7e84;font:500 11.5px/1.55 Manrope,sans-serif}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.quick a{min-height:48px;display:flex;align-items:center;justify-content:center;padding:10px;border-radius:14px;color:#ddd;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font:700 12px Manrope,sans-serif}
@media(min-width:720px){.j-grid{grid-template-columns:1.2fr .8fr}.j-bible{grid-row:span 2}.j-coming-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;grid-column:1/-1}}
@media(max-width:768px){.j-wrap{padding-top:86px}.j-head{align-items:flex-start}.j-card{will-change:transform}}
</style>
</head>
<body>
<nav class="navbar"><div class="navbar-inner"><a href="index.html" class="logo">GRI<span>A</span></a></div></nav>
<main class="j-wrap" id="root"></main>
<script>
(function(){
  const ACCESS_KEY='gria_member_access_v1',PASSWORD='GRIA2026',root=document.getElementById('root');
  function isMember(){try{return localStorage.getItem(ACCESS_KEY)==='yes'}catch(_){return false}}
  function showGate(){
    root.innerHTML=`<section class="j-gate"><div class="j-brand">Khusus Jemaat GRIA Palu</div><h1>Masuk sebagai Jemaat</h1><p>Masukkan kode akses untuk membuka fitur khusus anggota jemaat GRIA Palu.</p><div class="j-field"><label for="memberPass">Kode Jemaat</label><input id="memberPass" type="password" placeholder="Masukkan kode" autocomplete="off"></div><button class="j-btn" id="memberBtn">Masuk ke Fitur Jemaat</button><div class="j-error" id="memberError">Kode belum sesuai. Silakan coba lagi.</div><div class="j-help">Belum mengetahui kode? Tanyakan melalui <strong>grup WhatsApp GRIA</strong> untuk masuk sebagai Jemaat GRIA Palu.</div></section>`;
    const input=document.getElementById('memberPass');
    const submit=()=>{if(input.value.trim()===PASSWORD){try{localStorage.setItem(ACCESS_KEY,'yes');localStorage.setItem('gria_entry_mode','member')}catch(_){}renderMember()}else{document.getElementById('memberError').classList.add('show');input.focus()}};
    document.getElementById('memberBtn').onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
  }
  function revealCards(){const cards=document.querySelectorAll('.j-card');const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target)}}),{threshold:.15});cards.forEach((c,i)=>{c.style.transitionDelay=(i*70)+'ms';io.observe(c)})}
  function renderMember(){
    root.innerHTML=`<header class="j-head"><div><h1>Jemaat GRIA</h1><p>Ruang pertumbuhan khusus anggota jemaat GRIA Palu.</p></div><button class="j-lock" id="lockBtn">Keluar</button></header><div class="j-grid"><section class="j-card j-bible"><h2>Alkitab</h2><div class="j-main-title">Baca & Bandingkan Teks Alkitab</div><p class="j-desc">Buka Alkitab dalam Bahasa Inggris, teks Ibrani Perjanjian Lama, dan teks Yunani Perjanjian Baru.</p><div class="j-meta"><span class="j-chip">English · KJV</span><span class="j-chip">Hebrew · WLC</span><span class="j-chip">Greek · TR</span></div><a class="j-primary" href="alkitab.html">Buka Alkitab</a></section><section class="j-card"><h2>Akses Jemaat</h2><div class="j-main-title" style="font-size:21px">Persekutuan</div><p class="j-desc">Pendalaman Alkitab dan Persekutuan Doa dalam satu ruang.</p><div class="quick"><a href="persekutuan.html">Buka Persekutuan</a><a href="warta.html#informasi-umum">Jadwal Doa</a></div></section><div class="j-coming-row"><section class="j-card j-coming-card"><div><span class="j-coming">Coming Soon</span><div class="j-main-title" style="font-size:20px;margin-top:16px">Bible Reading Tracker 2027</div><p class="j-desc">Program bacaan Alkitab tahunan yang akan dimulai pada 2027.</p></div><div class="j-note">Sedang disiapkan untuk perjalanan baca bersama jemaat.</div></section><section class="j-card j-coming-card"><div><span class="j-coming">Coming Soon</span><div class="j-main-title" style="font-size:20px;margin-top:16px">Bank Ayat Tahunan</div><p class="j-desc">Koleksi ayat pilihan tahunan yang dikumpulkan oleh para member GRIA.</p></div><div class="j-note">Nantinya setiap member dapat berkontribusi dan menyimpan ayat pilihan.</div></section></div></div>`;
    document.getElementById('lockBtn').onclick=()=>{try{localStorage.removeItem(ACCESS_KEY);localStorage.setItem('gria_entry_mode','guest')}catch(_){}showGate()};revealCards();
  }
  if(isMember())renderMember();else showGate();
})();
</script>
<script src="pwa.js" defer></script>
</body>
</html>
