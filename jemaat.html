<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0c"><title>Jemaat — GRIA Pemulihan Palu</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"><style>
body{background:radial-gradient(circle at 50% -5%,rgba(204,255,0,.07),transparent 28%),var(--bg-base)}.j-wrap{max-width:820px;margin:0 auto;padding:105px var(--pad) 115px;position:relative;z-index:2}.j-gate{max-width:500px;margin:0 auto;padding:28px 22px;border-radius:28px;background:linear-gradient(155deg,#141417,#0d0d0f);border:1px solid rgba(255,255,255,.08)}.j-brand{color:var(--neon);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.j-gate h1{font-size:clamp(30px,8vw,42px);margin:12px 0 11px;letter-spacing:-.04em}.j-gate p{color:#96979d;font-size:13.5px;line-height:1.65}.j-field{margin-top:24px}.j-field label{display:block;margin-bottom:7px;color:#bbb;font-size:12px;font-weight:650}.j-field input{width:100%;min-height:54px;padding:14px 16px;border-radius:16px;background:#08080a;color:#fff;border:1px solid rgba(255,255,255,.1);font-size:16px;outline:none}.j-field input:focus{border-color:rgba(204,255,0,.7);box-shadow:0 0 0 3px rgba(204,255,0,.08)}.j-btn{width:100%;min-height:52px;margin-top:13px;border-radius:16px;background:var(--neon);color:#050505;font-weight:800}.j-help{margin-top:14px;color:#74757b;font-size:11.5px;line-height:1.55}.j-error{display:none;margin-top:12px;padding:12px 13px;border-radius:13px;color:#ff9898;background:rgba(255,80,80,.07);border:1px solid rgba(255,80,80,.17);font-size:12px}.j-error.show{display:block}.j-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.j-head h1{font-size:clamp(28px,7vw,42px)}.j-head p{margin-top:5px;color:#8d8e94;font-size:12.5px}.j-lock{min-height:40px;padding:8px 12px;border-radius:999px;color:#aaa;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:650}.j-grid{display:grid;grid-template-columns:1fr;gap:13px}.j-card{padding:22px;border-radius:22px;background:linear-gradient(155deg,#131316,#0d0d0f);border:1px solid rgba(255,255,255,.075)}.j-card h2{font-size:13px;color:#a0a1a6;letter-spacing:.07em;text-transform:uppercase;margin-bottom:15px}.bible-day{color:var(--neon);font-size:12px;font-weight:750}.bible-title{margin-top:6px;font-size:24px;font-weight:800}.bible-sub{margin-top:5px;color:#888990;font-size:12px}.bar{height:10px;margin-top:18px;border-radius:999px;background:#070708;overflow:hidden;border:1px solid rgba(255,255,255,.07)}.fill{height:100%;background:var(--neon);border-radius:999px}.progress{display:flex;justify-content:space-between;margin-top:8px;color:#888990;font-size:11px}.read-btn{width:100%;min-height:46px;margin-top:16px;border-radius:14px;background:var(--neon);color:#050505;font-weight:800}.read-btn.done{color:var(--neon);background:rgba(204,255,0,.07);border:1px solid rgba(204,255,0,.16)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick a{min-height:48px;display:flex;align-items:center;justify-content:center;padding:10px;border-radius:14px;color:#ddd;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:12px;font-weight:700}.member-note{color:#8d8e94;font-size:12.5px;line-height:1.65}@media(min-width:720px){.j-grid{grid-template-columns:1.2fr .8fr}.bible-card{grid-row:span 2}}@media(max-width:768px){.j-wrap{padding-top:86px}}
</style></head><body><nav class="navbar"><div class="navbar-inner"><a href="index.html" class="logo">GRI<span>A</span></a></div></nav><main class="j-wrap" id="root"></main><script>
(function(){
  const ACCESS_KEY='gria_member_access_v1',PASSWORD='GRIA2026',root=document.getElementById('root');
  const isMember=()=>{try{return localStorage.getItem(ACCESS_KEY)==='yes'}catch(_){return false}};
  function showGate(){root.innerHTML=`<section class="j-gate"><div class="j-brand">Khusus Jemaat GRIA Palu</div><h1>Masuk sebagai Jemaat</h1><p>Masukkan kode akses untuk membuka fitur khusus anggota jemaat GRIA Palu.</p><div class="j-field"><label for="memberPass">Kode Jemaat</label><input id="memberPass" type="password" placeholder="Masukkan kode" autocomplete="off"></div><button class="j-btn" id="memberBtn">Masuk ke Fitur Jemaat</button><div class="j-error" id="memberError">Kode belum sesuai. Silakan coba lagi.</div><div class="j-help">Belum mengetahui kode? Tanyakan melalui <strong>grup WhatsApp GRIA</strong> untuk masuk sebagai Jemaat GRIA Palu.</div></section>`;const input=document.getElementById('memberPass');const submit=()=>{if(input.value.trim()===PASSWORD){try{localStorage.setItem(ACCESS_KEY,'yes');localStorage.setItem('gria_entry_mode','member')}catch(_){}renderMember()}else{document.getElementById('memberError').classList.add('show');input.focus()}};document.getElementById('memberBtn').onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()})}
  function getProgress(){try{return JSON.parse(localStorage.getItem('gria_bible_read_dates')||'[]')}catch(_){return[]}}function saveProgress(list){try{localStorage.setItem('gria_bible_read_dates',JSON.stringify(list))}catch(_){}}function todayKey(){return new Date().toISOString().slice(0,10)}
  function renderMember(){const progress=getProgress(),today=todayKey(),doneToday=progress.includes(today),completed=Math.min(progress.length,365),pct=Math.round(completed/365*100),dayNo=Math.min(completed+1,365);root.innerHTML=`<header class="j-head"><div><h1>Jemaat GRIA</h1><p>Ruang pribadi untuk pertumbuhan dan kehidupan jemaat.</p></div><button class="j-lock" id="lockBtn">Keluar</button></header><div class="j-grid"><section class="j-card bible-card"><h2>Alkitab Saya</h2><div class="bible-day">Hari ke-${dayNo} dari 365</div><div class="bible-title">Bible Reading Tracker</div><div class="bible-sub">Progress tersimpan di perangkat ini.</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="progress"><span>${completed}/365 hari</span><span>${pct}%</span></div><button class="read-btn ${doneToday?'done':''}" id="readBtn" ${doneToday?'disabled':''}>${doneToday?'✓ Sudah Dibaca Hari Ini':'Tandai Bacaan Hari Ini'}</button></section><section class="j-card"><h2>Akses Jemaat</h2><div class="quick"><a href="persekutuan.html">PA & Doa</a><a href="warta.html">Warta</a></div></section><section class="j-card"><h2>Catatan</h2><p class="member-note">Fitur Alkitab, tracker, Pendalaman Alkitab, dan Persekutuan Doa akan terus dikembangkan di area Jemaat ini.</p></section></div>`;document.getElementById('lockBtn').onclick=()=>{try{localStorage.removeItem(ACCESS_KEY);localStorage.setItem('gria_entry_mode','guest')}catch(_){}showGate()};const readBtn=document.getElementById('readBtn');if(readBtn&&!doneToday)readBtn.onclick=()=>{const list=getProgress();if(!list.includes(today))list.push(today);saveProgress(list);renderMember()}}
  if(isMember())renderMember();else showGate();
})();
</script><script src="pwa.js" defer></script></body></html>
