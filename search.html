<!DOCTYPE html>
<html lang="id" data-gria-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0c">
<title>Cari — GRIA Pemulihan Palu</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="gria-modern.css?v=18">
</head><body>
<nav class="navbar"><div class="navbar-inner"><a href="index.html" class="logo">GRI<span>A</span></a></div></nav>
<main class="gria-page">
<header class="gria-page-head"><span class="gria-page-kicker">GRIA Search</span><h1>Cari lebih cepat.</h1><p class="gria-page-sub">Cari Warta, jadwal pelayanan, persekutuan, Alkitab, event, dan fitur jemaat dari satu tempat.</p></header>
<section class="gria-panel"><input id="griaSearchInput" class="gria-input" type="search" autocomplete="off" placeholder="Contoh: jadwal pelayanan, Alkitab, PA..." autofocus></section>
<div id="griaSearchResults" class="gria-grid"></div>
</main>
<script src="pwa-v16.js" defer></script><script src="gria-modern.js?v=18" defer></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var input=document.getElementById('griaSearchInput'),box=document.getElementById('griaSearchResults');
  function paint(){
    var list=window.GRIA_APP?window.GRIA_APP.search(input.value):[];
    if(!list.length){box.innerHTML='<div class="gria-empty">Belum menemukan yang cocok. Coba kata yang lebih sederhana.</div>';return}
    box.innerHTML=list.map(function(x){return '<article class="gria-result"><small>GRIA</small><h2>'+x.title+'</h2><p>'+x.desc+'</p><a href="'+x.href+'">Buka →</a></article>'}).join('');
  }
  input.addEventListener('input',paint);paint();
});
</script></body></html>
